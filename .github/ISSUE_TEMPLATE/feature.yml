name: Feature request
description: Something oxsearch should do, such as an API area, a helper or an integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem you're solving, and how you'd use this.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Elasticsearch reference
      description: Links to the Elasticsearch API documentation or specification this relates to, if any.
