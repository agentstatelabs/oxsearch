name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      # Features the workspace build leaves off.
      - run: cargo clippy -p oxsearch --all-targets --all-features
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94
      - run: cargo check --workspace

  # The specification oxsearch is generated from: the pinned schema.json is
  # downloaded, checked against its SHA-256, and read with the generator's
  # model, which rejects anything it doesn't know. The test fixture must run
  # the same Elasticsearch minor. Then the crate placement, the shape
  # inventory and the generated code are produced again from it, and must
  # match what is committed: the code was generated from the pinned
  # specification, and nobody edited it by hand.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain whose rustfmt formatted the committed code.
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt
      - run: cargo run -p xtask -- spec check
      - run: cargo run -p xtask -- placement
      - run: cargo run -p xtask -- shapes
      - run: cargo run -p xtask -- generate
      - name: The committed reports and generated code are current
        shell: bash
        run: |
          git diff --exit-code
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "files the generator writes that aren't committed:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  # The compile-time budget (docs/compile-time.md): a clean build of the
  # front crate's default features, which is what an application adding
  # oxsearch compiles.
  compile-time:
    runs-on: ubuntu-latest
    env:
      BUDGET_SECONDS: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch
      - name: A clean build of the default features, timed
        shell: bash
        run: |
          start=$(date +%s)
          cargo build -p oxsearch --timings
          took=$(( $(date +%s) - start ))
          echo "A clean build of oxsearch's default features took ${took} s (budget ${BUDGET_SECONDS} s)." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$took" -le "$BUDGET_SECONDS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html

  # The integration tests, against Elasticsearch in Docker (see
  # scripts/es-fixture.sh): once on the Basic license, once on a trial.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        license: [basic, trial]
    env:
      OXSEARCH_TEST_LICENSE: ${{ matrix.license }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the integration tests
        run: cargo test -p oxsearch-integration --no-run
      - name: Start Elasticsearch on the ${{ matrix.license }} license
        run: scripts/es-fixture.sh up "${OXSEARCH_TEST_LICENSE}"
      - name: Integration tests
        run: cargo test -p oxsearch-integration -- --ignored
      - name: The examples run
        env:
          OXSEARCH_URL: http://127.0.0.1:9200
        run: |
          cargo run -p oxsearch --example rag --features transport-reqwest
          cargo run -p oxsearch --example escape_hatches --features transport-reqwest
      - name: Elasticsearch logs
        if: failure()
        run: scripts/es-fixture.sh logs | tail -200
