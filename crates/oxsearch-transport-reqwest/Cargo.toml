[package]
name = "oxsearch-transport-reqwest"
description = "The default HTTP transport for oxsearch, on reqwest"
readme = "../../README.md"
keywords = ["elasticsearch", "client", "http", "reqwest"]
categories = ["api-bindings", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
default = ["rustls"]
# HTTPS through rustls.
rustls = ["reqwest/rustls"]
# Compressed request bodies and responses.
gzip = ["dep:flate2", "reqwest/gzip"]

[dependencies]
bytes = "1.10"
flate2 = { version = "1.1", optional = true }
oxsearch-core = { path = "../oxsearch-core", version = "0.0.1" }
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
# The tests cover compression too.
oxsearch-transport-reqwest = { path = ".", features = ["gzip"] }
tokio = { version = "1.53", features = ["macros", "rt", "net", "io-util", "time"] }
serde_json = "1.0.149"

[lints]
workspace = true
