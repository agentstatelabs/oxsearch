[package]
name = "oxsearch-inference"
description = "The inference API for oxsearch (embeddings, sparse embeddings, rerank, completion), generated from the Elasticsearch specification"
readme = "../../README.md"
keywords = ["elasticsearch", "search", "client"]
categories = ["api-bindings", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[lib]
# The generated documentation quotes Elasticsearch's own, which isn't Rust.
doctest = false

[dependencies]
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
oxsearch-core = { path = "../oxsearch-core", version = "0.0.1" }

[dev-dependencies]
# The generated example tests report where an example doesn't fit.
serde_path_to_error = "0.1.20"

[lints]
workspace = true
