[package]
name = "oxsearch"
description = "A typed Rust client for Elasticsearch, generated from its specification, with typed AI search: retrievers, semantic and kNN queries, and inference"
readme = "../../README.md"
keywords = ["elasticsearch", "search", "client", "vector", "rag"]
categories = ["api-bindings", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[features]
# The AI-search set.
default = ["search", "docs", "mapping", "inference"]
search = ["dep:oxsearch-search"]
docs = ["dep:oxsearch-docs"]
mapping = ["dep:oxsearch-mapping"]
inference = ["dep:oxsearch-inference"]
# The other API areas generated so far.
aggs = ["dep:oxsearch-aggs", "search"]
admin = ["dep:oxsearch-admin"]
esql = ["dep:oxsearch-esql"]
# ES|QL results as Arrow record batches (`Esql::fetch_arrow`).
esql-arrow = ["esql", "oxsearch-esql/arrow"]
ingest = ["dep:oxsearch-ingest"]
analysis = ["dep:oxsearch-analysis"]
tasks = ["dep:oxsearch-tasks"]
# The typed document layer, `oxsearch::document`, which creates and maps
# indices with the admin area.
document = ["docs", "search", "mapping", "admin"]
# `#[derive(Document)]` for the typed document layer.
derive = ["dep:oxsearch-derive", "document"]
# Point-in-time streams and the bulk loader, which run on Tokio.
helpers = ["search", "docs", "dep:tokio", "dep:futures-core", "dep:futures-util", "dep:metrics"]
# The default HTTP transport. Whether it is on by default is still open
# (DESIGN.md, open question 5).
transport-reqwest = ["dep:oxsearch-transport-reqwest"]
# Endpoints Elasticsearch marks beta or experimental, in the areas enabled:
# they may change or go away in any Elasticsearch release.
beta = ["oxsearch-core/beta", "oxsearch-analysis?/beta", "oxsearch-mapping?/beta", "oxsearch-tasks?/beta", "oxsearch-inference?/beta", "oxsearch-search?/beta", "oxsearch-docs?/beta", "oxsearch-aggs?/beta", "oxsearch-admin?/beta", "oxsearch-esql?/beta", "oxsearch-ingest?/beta"]
experimental = ["oxsearch-core/experimental", "oxsearch-analysis?/experimental", "oxsearch-mapping?/experimental", "oxsearch-tasks?/experimental", "oxsearch-inference?/experimental", "oxsearch-search?/experimental", "oxsearch-docs?/experimental", "oxsearch-aggs?/experimental", "oxsearch-admin?/experimental", "oxsearch-esql?/experimental", "oxsearch-ingest?/experimental"]

[dependencies]
oxsearch-core = { path = "../oxsearch-core", version = "0.1.0" }
oxsearch-search = { path = "../oxsearch-search", version = "0.1.0", optional = true }
oxsearch-docs = { path = "../oxsearch-docs", version = "0.1.0", optional = true }
oxsearch-mapping = { path = "../oxsearch-mapping", version = "0.1.0", optional = true }
oxsearch-inference = { path = "../oxsearch-inference", version = "0.1.0", optional = true }
oxsearch-admin = { path = "../oxsearch-admin", version = "0.1.0", optional = true }
oxsearch-esql = { path = "../oxsearch-esql", version = "0.1.0", optional = true }
oxsearch-ingest = { path = "../oxsearch-ingest", version = "0.1.0", optional = true }
oxsearch-aggs = { path = "../oxsearch-aggs", version = "0.1.0", optional = true }
oxsearch-analysis = { path = "../oxsearch-analysis", version = "0.1.0", optional = true }
oxsearch-tasks = { path = "../oxsearch-tasks", version = "0.1.0", optional = true }
oxsearch-derive = { path = "../oxsearch-derive", version = "0.1.0", optional = true }
oxsearch-transport-reqwest = { path = "../oxsearch-transport-reqwest", version = "0.1.0", optional = true }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"], optional = true }
futures-core = { version = "0.3.31", optional = true }
futures-util = { version = "0.3.31", default-features = false, features = ["std"], optional = true }
metrics = { version = "0.24", optional = true }

[dev-dependencies]
# The tests cover the document layer's derive macro too.
oxsearch = { path = ".", features = ["derive", "helpers"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "time"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }

[[example]]
name = "rag"
required-features = ["admin", "transport-reqwest"]

[[example]]
name = "escape_hatches"
required-features = ["transport-reqwest"]

[[example]]
name = "quickstart"
required-features = ["derive", "transport-reqwest"]

[package.metadata.docs.rs]
# Document the APIs behind features too.
all-features = true

[lints]
workspace = true
