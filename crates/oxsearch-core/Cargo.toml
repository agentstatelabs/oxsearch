[package]
name = "oxsearch-core"
description = "The core of oxsearch: the transport and endpoint traits, errors, and the common types, query DSL, retrievers and kNN generated from the Elasticsearch specification"
readme = "../../README.md"
keywords = ["elasticsearch", "search", "client"]
categories = ["api-bindings", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[dependencies]
indexmap = { version = "2.14", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
# The generated example tests report where an example doesn't fit.
serde_path_to_error = "0.1.20"

[lints]
workspace = true
