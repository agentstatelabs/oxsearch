# The Elasticsearch fixture for the integration tests. Start and stop it with
# scripts/es-fixture.sh, which also picks the license.
#
# The version is on the same minor as the specification pin (spec/pin.toml);
# `cargo run -p xtask -- spec check` fails if they drift apart.
name: oxsearch-fixture

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.5.7}
    environment:
      discovery.type: single-node
      # The tests talk plain HTTP with no credentials, unless
      # OXSEARCH_TEST_SECURITY is true: then security is on, the elastic
      # user's password is OXSEARCH_TEST_PASSWORD, and the token service,
      # which otherwise needs TLS, is on too. Still plain HTTP, on one node.
      xpack.security.enabled: ${OXSEARCH_TEST_SECURITY:-false}
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.authc.token.enabled: "true"
      ELASTIC_PASSWORD: ${OXSEARCH_TEST_PASSWORD:-}
      # Every node starts on Basic; the fixture script starts a trial when
      # asked to.
      xpack.license.self_generated.type: basic
      # CI runners' disks are small and fill up; the watermarks would stop
      # shards from allocating.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # On a trial, tests deploy machine learning models (ELSER for
      # semantic_text, a reranker); let them use the machine's memory.
      xpack.ml.use_auto_machine_memory_percent: "true"
      # Shared file system snapshot repositories must be under this
      # directory.
      path.repo: /usr/share/elasticsearch/snapshots
      # Sniffing reads the address the node publishes: make it the one the
      # tests reach it at, not the container's own.
      http.publish_host: 127.0.0.1
      http.publish_port: ${OXSEARCH_TEST_PORT:-9200}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${OXSEARCH_TEST_PORT:-9200}:9200"
    # The inference tests run a mock of a provider's API on the machine
    # that runs them, and Elasticsearch calls it at this name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 90
